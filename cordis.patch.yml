# dsh-reference-anything — the layer this bundle contributes.
#
# A patch REPLACES a row's whole `config` rather than merging keys, so when you
# override one of these in your profile's cordis.patch.yml, restate every key
# the row needs.
- insert:
    # The harness's own cross-session resolver. It ships with dsh but no shipped
    # composition mounts it, so `dsh-session:` mentions resolve to nothing until
    # something does. Mounting it here is what makes the mention expander below
    # able to serve both schemes.
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    # The registry every source registers into.
    - id: references
      name: 'dsh-reference-anything'
      config:
        listLimit: 20

    # Expands `@[label](dsh-ref:…)` and `dsh-session:` mentions in a user's
    # prompt into untrusted background, on every surface. It grants the agent
    # the exact reference URI but does not fetch a transcript; the agent calls
    # reference_read only when the current task needs one.
    - id: reference-mention
      name: 'dsh-reference-anything/reference'
      config:
        maxReferences: 3
        serveSessionScheme: true

    # Lets the model go looking on its own, and page backwards through a
    # conversation it has only seen the end of.
    - id: reference-tool
      name: 'dsh-reference-anything/tool'
      config:
        listLimit: 20
        maxOutputBytes: 65536
        readTurns: 10
        maxReadTurns: 50
        timeoutMs: 30000

    # Durable, local-only mirror of ChatGPT/Claude/Gemini/DeepSeek/Grok.
    # Browser requests happen during an explicit sync, or — only when the user
    # opts in via the Conversations settings panel — on a background interval.
    - id: reference-web-chat
      name: 'dsh-reference-anything/web-chat'
      config:
        timeoutMs: 60000
        maxStdoutBytes: 33554432

    # Host Remote used by the Web @Conversation source and settings panel.
    - id: reference-anything-web
      name: 'dsh-reference-anything/web'

    # Exported conversations on disk. Inert until the directory exists, so the
    # default is safe; point `roots` wherever you keep your exports.
    - id: reference-file
      name: 'dsh-reference-anything/file'
      config:
        # External plugin overlays intentionally cannot evaluate !!js. This
        # portable relative root stays inert unless the launched workspace has
        # a references/ directory; users may override it with absolute roots.
        roots: ['references']
        extensions: ['.json']
