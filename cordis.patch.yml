# dsh-reference-anything — the layer this bundle contributes.
#
# A patch REPLACES a row's whole `config` rather than merging keys, so when you
# override one of these in your profile's cordis.patch.yml, restate every key
# the row needs.
- id: ui-reference
  # Reference Anything re-registers Files and DSH sessions as two independent
  # sources over the same official Remotes.  Disabling only this Client source
  # keeps the official file/session services and canonical mention semantics.
  disabled: true

- insert:
    # The registry every source registers into.
    - id: references
      name: 'dsh-reference-anything'
      config:
        listLimit: 20

    # Expands plugin-owned `@[label](dsh-ref:…)` mentions into untrusted
    # metadata on every surface. Native file and `dsh-session:` references stay
    # with DSH's official services. External transcripts are not prefetched;
    # the agent calls reference_read only when the current task needs one.
    - id: reference-mention
      name: 'dsh-reference-anything/reference'
      config:
        maxReferences: 3

    # Lets the model go looking on its own, and page backwards through a
    # conversation it has only seen the end of.
    - id: reference-tool
      name: 'dsh-reference-anything/tool'
      config:
        listLimit: 20
        maxOutputBytes: 65536
        readTurns: 10
        maxReadTurns: 50
        timeoutMs: 30000

    # Durable, local-only mirror of ChatGPT/Claude/Gemini/DeepSeek/Grok.
    # Browser requests happen during an explicit sync, or — only when the user
    # opts in via the Conversations settings panel — on a background interval.
    - id: reference-web-chat
      name: 'dsh-reference-anything/web-chat'
      config:
        timeoutMs: 60000
        maxStdoutBytes: 33554432

    # Host Remote used by the Web @Conversation source and settings panel.
    - id: reference-anything-web
      name: 'dsh-reference-anything/web'

    # Exported conversations on disk. Inert until the directory exists, so the
    # default is safe; point `roots` wherever you keep your exports.
    - id: reference-file
      name: 'dsh-reference-anything/file'
      config:
        # External plugin overlays intentionally cannot evaluate !!js. This
        # portable relative root stays inert unless the launched workspace has
        # a references/ directory; users may override it with absolute roots.
        roots: ['references']
        extensions: ['.json']

    # Text files in the user's own cloud drives, listed by name and read a
    # window at a time. Reading one needs a per-task grant: these are personal
    # remote files, so the model may only open what its user named. Inert
    # without a credential — a drive that has never been logged into simply
    # reports unavailable, so the default is safe.
    - id: reference-cloud-drive
      name: 'dsh-reference-anything/cloud-drive'
      config:
        # Both drives are listed because listing one costs nothing until it is
        # logged into: with no credential on disk a drive is skipped outright,
        # so it is absent from the menu rather than an empty group. Removing a
        # name here stops that drive being reached even if its CLI is logged in.
        drives: ['baidu', 'pds']
        # Where listing starts, for any drive with no entry in `roots` below.
        # Only safe to share while it is empty, because the two products do not
        # address a folder the same way: Baidu takes a path under its /apps/bdpan/
        # sandbox, PDS takes a folder id or an absolute path in the whole drive.
        root: ''
        # Per-drive roots, e.g. {baidu: '/notes', pds: '/工作/报告'}. Needed as
        # soon as you want to narrow more than one drive at once.
        roots: {}
        listTtlMs: 30000
        # 64 KiB at 4000 characters a block is at most 17 blocks, which fits
        # inside maxReadTurns — so an ordinary text file is returned whole,
        # from its beginning. Raising this buys reach at the cost of a first
        # page that lands at the end of the file.
        maxReadBytes: 65536
        maxReadTurns: 20
        blockChars: 4000

    # Transcripts other coding agents leave on disk, listed by title and read a
    # window at a time. Reading one needs a per-task grant: these are other
    # sessions' conversations, so the model may only open what its user named.
    - id: reference-local-agent
      name: 'dsh-reference-anything/local-agent'
      config:
        # Every format this package reads, at each agent's own default location
        # under $HOME. An agent that is not installed simply has no directory,
        # which is not an error. Ordered by how well the format is validated:
        # the first two were built against real corpora, the rest from format
        # documentation and synthetic fixtures. Drop the unvalidated ones from
        # this list to run on the two that were measured.
        agents: ['claude-code', 'codex', 'cursor', 'qoder', 'reasonix', 'openclaw',
                 'kimi', 'grokbuild', 'hermes', 'gemini-cli', 'pi',
                 'opencode', 'mimocode', 'zcode']
        extraRoots: []
        # Only sessions recorded in this workspace. `all` lists every transcript
        # on the machine, which is a lot of other projects' titles.
        scope: 'workspace'
        maxTranscripts: 200
        maxReadTurns: 20
        maxScanBytes: 33554432
        headLines: 40
        tailLines: 20
        maxProbeBytes: 2097152
        maxLineBytes: 1048576
        directoryTtlMs: 5000
        includeThinking: false
        toolCalls: 'elide'
        includeSidechains: false
        stripEnvironmentPreamble: true
        # The last three formats keep every conversation in one SQLite database
        # rather than a file apiece, so reading them needs `node:sqlite`. Set
        # this to false and the driver is never imported at all: no root of
        # those kinds is resolved, so no database is ever opened.
        sqlite: true
        # Most message rows to materialize from one database-backed session,
        # counted from the newest. A database cannot be streamed the way a JSONL
        # file can, so this is what bounds the memory a read costs.
        maxSessionRecords: 2000
