name: Post npm publish

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Original Release run ID containing npm-candidate (no npm upload)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve original release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > "$RUNNER_TEMP/original-run.json"
          jq -e --arg repo "$GH_REPO" '.repository.full_name == $repo and .path == ".github/workflows/release.yml" and .event == "workflow_dispatch" and .head_branch == "main" and .status == "completed"' "$RUNNER_TEMP/original-run.json"
          sha=$(jq -r .head_sha "$RUNNER_TEMP/original-run.json")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Verify original package on npm (never upload)
        working-directory: ${{ runner.temp }}/candidate
        run: node "$GITHUB_WORKSPACE/scripts/agent/release-ci.mjs" verify

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Publish original release notes and tgz
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: bash "$GITHUB_WORKSPACE/automation/scripts/agent/github-release.sh"
