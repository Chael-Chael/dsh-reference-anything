name: Release

# An explicit dispatch keeps source pushes and draft uploads separate from publication.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing approved tag, e.g. v0.6.0'
        required: true
        type: string
      sha256:
        description: SHA-256 of the approved candidate.tgz release asset
        required: true
        type: string
      publish:
        description: 'Publish the approved candidate to npm and make the Release public'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    outputs:
      head: ${{ steps.candidate.outputs.head }}
    env:
      TAG: ${{ inputs.tag }}
      SHA256: ${{ inputs.sha256 }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select a release commit on main
        id: candidate
        shell: bash
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "Run this workflow from main"; exit 1; }
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          head="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor "$head" origin/main
          git checkout --detach "$head"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download approved draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          gh release download "$TAG" --dir "$RUNNER_TEMP/candidate" \
            --pattern candidate.tgz --pattern release-notes.md --pattern release-manifest.json
          (cd "$RUNNER_TEMP/candidate" && echo "$SHA256  candidate.tgz" | sha256sum --check)
          node scripts/agent/release-ci.mjs verify "$RUNNER_TEMP/candidate" "$TAG"
      - run: npm install --global pnpm@11.22.0
      - run: pnpm install --frozen-lockfile
      - run: npm run check
      - name: Preserve exactly the verified candidate
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ inputs.publish }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      SHA256: ${{ inputs.sha256 }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.16.0
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
      - name: Recheck candidate and publish the accepted tarball
        shell: bash
        run: |
          directory="$RUNNER_TEMP/candidate"
          (cd "$directory" && echo "$SHA256  candidate.tgz" | sha256sum --check)
          node scripts/agent/release-ci.mjs verify "$directory" "$TAG"
          state="$(node scripts/agent/release-ci.mjs registry "$directory")"
          dist_tag=latest
          [[ "$TAG" != *-* ]] || dist_tag=next
          if [[ "$state" == missing ]]; then
            # Publish the accepted bytes; validation already ran check in the preceding job.
            (cd "$directory" && npm publish candidate.tgz --access public --provenance --tag "$dist_tag") || {
              node scripts/agent/release-ci.mjs confirm "$directory"
            }
          fi
          node scripts/agent/release-ci.mjs confirm "$directory"
          version="${TAG#v}"
          actual="$(npm view dsh-reference-anything "dist-tags.$dist_tag")"
          [[ "$actual" == "$version" ]] || { echo "dist-tag mismatch; inspect npm before changing tags"; exit 1; }
      - name: Publish the reviewed Release notes verbatim
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=false
          latest=true
          if [[ "$TAG" == *-* ]]; then prerelease=true; latest=false; fi
          gh release edit "$TAG" --draft=false --title "$TAG" \
            --prerelease="$prerelease" --latest="$latest" \
            --notes-file "$RUNNER_TEMP/candidate/release-notes.md"
